[project]
name = "thesis-insect-monitoring"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fire==0.4.0",
    "h5py>=3.14.0",
    "jupyterlab>=4.5.6",
    "keyboard>=0.13.5",
    "kornia>=0.8.1",
    "networkx>=3.5",
    "numba>=0.61.2",
    "pandas-stubs~=2.3.1",
    "plotly[express]>=6.3.0",
    "pygame>=2.6.1",
    "pypylon>=4.2.0",
    "scikit-learn>=1.7.2",
    "scipy-stubs~=1.16.1",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "ultralytics>=8.3.178",
]

[tool.uv.workspace]
members = [
    "thesis-insect-monitoring",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "jupyterlab>=4.4.5",
    "matplotlib>=3.10.5",
    "opencv-python>=4.12.0.88",
    "video2calibration>=0.0.1",
]
